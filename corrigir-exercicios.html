<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corrigir Exercícios — Traduzir Inglês → Português</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 32px 16px;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 40px;
        max-width: 680px;
        width: 100%;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 6px;
      }
      .subtitle {
        font-size: 0.875rem;
        color: #94a3b8;
        margin-bottom: 28px;
      }

      /* Seção de diagnóstico */
      #diag-section {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 24px;
        font-size: 0.8rem;
        color: #94a3b8;
        display: none;
      }
      #diag-section h3 {
        color: #7dd3fc;
        font-size: 0.85rem;
        margin-bottom: 10px;
      }
      .diag-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .diag-label {
        color: #64748b;
      }
      .diag-val {
        color: #e2e8f0;
        font-family: monospace;
        font-size: 0.75rem;
        max-width: 300px;
        word-break: break-all;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 600;
        margin-left: 6px;
      }
      .badge-ok {
        background: #14532d;
        color: #4ade80;
      }
      .badge-warn {
        background: #451a03;
        color: #fb923c;
      }

      /* Botões */
      .btn-row {
        display: flex;
        gap: 10px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      button {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.2s,
          opacity 0.2s;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      /* Login */
      #login-section {
        margin-bottom: 24px;
      }
      #login-section label {
        display: block;
        font-size: 0.8rem;
        color: #94a3b8;
        margin-bottom: 4px;
      }
      #login-section input {
        width: 100%;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px 14px;
        color: #f8fafc;
        font-size: 0.9rem;
        margin-bottom: 12px;
        outline: none;
      }
      #login-section input:focus {
        border-color: #2563eb;
      }
      #btn-login {
        background: #2563eb;
        color: #fff;
        width: 100%;
      }
      #btn-login:hover:not(:disabled) {
        background: #1d4ed8;
      }
      #login-error {
        color: #f87171;
        font-size: 0.8rem;
        margin-top: 6px;
        min-height: 18px;
      }
      #user-info {
        display: none;
        align-items: center;
        justify-content: space-between;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.82rem;
        color: #94a3b8;
        margin-bottom: 20px;
      }
      #user-info span {
        color: #4ade80;
      }
      #btn-logout {
        background: #334155;
        color: #94a3b8;
        padding: 6px 14px;
        font-size: 0.78rem;
      }
      #btn-logout:hover {
        background: #475569;
      }
      /* Botões de ação — ocultados até login */
      #main-actions {
        display: none;
      }

      #btn-diag {
        background: #0369a1;
        color: #fff;
      }
      #btn-diag:hover:not(:disabled) {
        background: #0284c7;
      }
      #btn-corrigir {
        background: #16a34a;
        color: #fff;
      }
      #btn-corrigir:hover:not(:disabled) {
        background: #15803d;
      }

      /* Progresso */
      #progress-section {
        display: none;
        margin-top: 4px;
      }
      .progress-track {
        background: #0f172a;
        border-radius: 999px;
        height: 10px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #16a34a, #4ade80);
        border-radius: 999px;
        width: 0%;
        transition: width 0.3s ease;
      }
      .progress-label {
        font-size: 0.78rem;
        color: #94a3b8;
        text-align: right;
        margin-bottom: 12px;
      }
      #status-text {
        font-size: 0.875rem;
        color: #cbd5e1;
        min-height: 20px;
        margin-bottom: 8px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 10px;
      }
      .stat-box {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 10px;
        text-align: center;
      }
      .stat-box .val {
        font-size: 1.4rem;
        font-weight: 700;
        color: #f8fafc;
      }
      .stat-box .lbl {
        font-size: 0.68rem;
        color: #64748b;
        margin-top: 2px;
      }

      /* Log */
      #log {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 12px;
        height: 200px;
        overflow-y: auto;
        font-size: 0.72rem;
        font-family: "Cascadia Code", "Fira Code", monospace;
        color: #64748b;
        margin-top: 14px;
      }
      #log .ok {
        color: #4ade80;
      }
      #log .warn {
        color: #facc15;
      }
      #log .err {
        color: #f87171;
      }
      #log .info {
        color: #7dd3fc;
      }
      #log .skip {
        color: #475569;
      }

      /* Resultado */
      #resultado {
        display: none;
        margin-top: 20px;
        padding: 16px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        text-align: center;
      }
      #resultado.sucesso {
        background: #14532d;
        border: 1px solid #16a34a;
        color: #4ade80;
      }
      #resultado.erro {
        background: #450a0a;
        border: 1px solid #dc2626;
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🔧 Corrigir Exercícios</h1>
      <p class="subtitle">
        Traduz campos em inglês (chest, barbell…) para português (Peitoral,
        Barra…) no Firebase.
      </p>

      <!-- Login -->
      <div id="login-section">
        <label for="inp-email">E-mail (conta admin)</label>
        <input type="email" id="inp-email" placeholder="admin@exemplo.com" />
        <label for="inp-senha">Senha</label>
        <input type="password" id="inp-senha" placeholder="••••••••" />
        <button id="btn-login">🔐 Entrar</button>
        <div id="login-error"></div>
      </div>

      <!-- Info do usuário logado -->
      <div id="user-info">
        <span id="user-email"></span>
        <button id="btn-logout">Sair</button>
      </div>

      <!-- Ações principais (visíveis só após login) -->
      <div id="main-actions">
        <div class="btn-row">
          <button id="btn-diag">🔍 1. Diagnóstico (ver amostra)</button>
          <button id="btn-corrigir" disabled>
            ✅ 2. Corrigir banco de dados
          </button>
        </div>
      </div>

      <!-- Diagnóstico -->
      <div id="diag-section">
        <h3>📊 Amostra do banco (primeiros 5 exercícios)</h3>
        <div id="diag-content"></div>
      </div>

      <!-- Progresso -->
      <div id="progress-section">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">0 / 0</div>
        <div id="status-text">Aguardando…</div>

        <div class="stats">
          <div class="stat-box">
            <div class="val" id="stat-total">0</div>
            <div class="lbl">Total</div>
          </div>
          <div class="stat-box">
            <div class="val" id="stat-corrigido" style="color: #4ade80">0</div>
            <div class="lbl">Corrigidos</div>
          </div>
          <div class="stat-box">
            <div class="val" id="stat-skip" style="color: #94a3b8">0</div>
            <div class="lbl">Já OK</div>
          </div>
          <div class="stat-box">
            <div class="val" id="stat-err" style="color: #f87171">0</div>
            <div class="lbl">Erros</div>
          </div>
        </div>

        <div id="log"></div>
      </div>

      <div id="resultado"></div>
    </div>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
      /* ══════════ FIREBASE CONFIG ══════════ */
      const firebaseConfig = {
        apiKey: "AIzaSyBnP4bA-sBcREdb4UzN9jOkxxIuPFog_Ek",
        authDomain: "app-treino-academia.firebaseapp.com",
        databaseURL: "https://app-treino-academia-default-rtdb.firebaseio.com",
        projectId: "app-treino-academia",
        storageBucket: "app-treino-academia.firebasestorage.app",
        messagingSenderId: "719877721910",
        appId: "1:719877721910:web:ab1eca0d9db20d0d39ed97",
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const auth = firebase.auth();

      /* ══════════ AUTH ══════════ */
      const elLoginSection = document.getElementById("login-section");
      const elUserInfo = document.getElementById("user-info");
      const elMainActions = document.getElementById("main-actions");
      const elUserEmail = document.getElementById("user-email");
      const elLoginError = document.getElementById("login-error");
      const btnLogin = document.getElementById("btn-login");
      const btnLogout = document.getElementById("btn-logout");

      auth.onAuthStateChanged((user) => {
        if (user) {
          elLoginSection.style.display = "none";
          elUserInfo.style.display = "flex";
          elMainActions.style.display = "block";
          elUserEmail.textContent = user.email;
        } else {
          elLoginSection.style.display = "block";
          elUserInfo.style.display = "none";
          elMainActions.style.display = "none";
        }
      });

      btnLogin.addEventListener("click", async () => {
        const email = document.getElementById("inp-email").value.trim();
        const senha = document.getElementById("inp-senha").value;
        elLoginError.textContent = "";
        if (!email || !senha) {
          elLoginError.textContent = "Preencha e-mail e senha.";
          return;
        }
        btnLogin.disabled = true;
        btnLogin.textContent = "Entrando…";
        try {
          await auth.signInWithEmailAndPassword(email, senha);
        } catch (err) {
          const msgs = {
            "auth/user-not-found": "Usuário não encontrado.",
            "auth/wrong-password": "Senha incorreta.",
            "auth/invalid-email": "E-mail inválido.",
            "auth/too-many-requests": "Muitas tentativas. Tente mais tarde.",
          };
          elLoginError.textContent = msgs[err.code] || err.message;
        } finally {
          btnLogin.disabled = false;
          btnLogin.textContent = "🔐 Entrar";
        }
      });

      btnLogout.addEventListener("click", () => auth.signOut());

      /* ══════════ TABELAS DE TRADUÇÃO ══════════ */
      const T_MUSCULO = {
        chest: "Peitoral",
        back: "Costas",
        shoulders: "Ombros",
        "upper arms": "Braços",
        "lower arms": "Antebraços",
        "upper legs": "Quadríceps / Posteriores",
        "lower legs": "Panturrilha / Tibial",
        waist: "Abdômen",
        biceps: "Bíceps",
        triceps: "Tríceps",
        abdominals: "Abdômen",
        quadriceps: "Quadríceps",
        hamstrings: "Posteriores de Coxa",
        glutes: "Glúteos",
        calves: "Panturrilha",
        forearms: "Antebraços",
        traps: "Trapézio",
        lats: "Latíssimo do Dorso",
        "middle back": "Dorsal Médio",
        "lower back": "Lombar",
        neck: "Pescoço",
        abductors: "Abdutores",
        adductors: "Adutores",
        brachialis: "Braquial",
      };

      const T_EQUIPAMENTO = {
        barbell: "Barra",
        dumbbell: "Halteres",
        cable: "Cabo / Pulley",
        machine: "Máquina",
        kettlebell: "Kettlebell",
        bands: "Elástico",
        "medicine ball": "Bola Medicinal",
        "body only": "Peso Corporal",
        "e-z curl bar": "Barra W",
        "foam roll": "Rolo de Espuma",
        "exercise ball": "Bola de Exercício",
        other: "Outro",
        none: "Sem Equipamento",
      };

      const T_NIVEL = {
        beginner: "Iniciante",
        intermediate: "Intermediário",
        expert: "Avançado",
      };

      const T_MECANICA = {
        compound: "Composto",
        isolation: "Isolador",
      };

      const T_FORCA = {
        push: "Empurrar",
        pull: "Puxar",
        static: "Estático",
      };

      /* ══════════ HELPERS ══════════ */
      function traduzir(tabela, valor) {
        if (!valor) return valor;
        const chave = valor.trim().toLowerCase();
        return tabela[chave] ?? valor; // se não encontrar, mantém original
      }

      function precisaTraduzir(tabela, valor) {
        if (!valor) return false;
        const chave = valor.trim().toLowerCase();
        return chave in tabela;
      }

      function corrigirExercicio(key, dados) {
        const atualizado = { ...dados };
        let mudou = false;

        // musculo_principal
        if (precisaTraduzir(T_MUSCULO, dados.musculo_principal)) {
          atualizado.musculo_principal = traduzir(
            T_MUSCULO,
            dados.musculo_principal,
          );
          mudou = true;
        }

        // musculo_secundario (pode ser string com vírgula ou array serializado)
        if (dados.musculo_secundario) {
          const partes = dados.musculo_secundario
            .split(",")
            .map((s) => s.trim());
          const traduzidos = partes.map((p) => traduzir(T_MUSCULO, p));
          const novo = traduzidos.join(", ");
          if (novo !== dados.musculo_secundario) {
            atualizado.musculo_secundario = novo;
            mudou = true;
          }
        }

        // equipamento
        if (precisaTraduzir(T_EQUIPAMENTO, dados.equipamento)) {
          atualizado.equipamento = traduzir(T_EQUIPAMENTO, dados.equipamento);
          mudou = true;
        }

        // nivel
        if (precisaTraduzir(T_NIVEL, dados.nivel)) {
          atualizado.nivel = traduzir(T_NIVEL, dados.nivel);
          mudou = true;
        }

        // mecanica
        if (precisaTraduzir(T_MECANICA, dados.mecanica)) {
          atualizado.mecanica = traduzir(T_MECANICA, dados.mecanica);
          mudou = true;
        }

        // forca
        if (precisaTraduzir(T_FORCA, dados.forca)) {
          atualizado.forca = traduzir(T_FORCA, dados.forca);
          mudou = true;
        }

        return { atualizado, mudou };
      }

      /* ══════════ UI HELPERS ══════════ */
      const elDiag = document.getElementById("diag-section");
      const elDiagCont = document.getElementById("diag-content");
      const elProg = document.getElementById("progress-section");
      const elFill = document.getElementById("progress-fill");
      const elLabel = document.getElementById("progress-label");
      const elStatus = document.getElementById("status-text");
      const elLog = document.getElementById("log");
      const elResultado = document.getElementById("resultado");
      const btnDiag = document.getElementById("btn-diag");
      const btnCorrigir = document.getElementById("btn-corrigir");
      const elTotal = document.getElementById("stat-total");
      const elCorrigido = document.getElementById("stat-corrigido");
      const elSkip = document.getElementById("stat-skip");
      const elErr = document.getElementById("stat-err");

      let cTotal = 0,
        cCorrigido = 0,
        cSkip = 0,
        cErr = 0;

      function log(msg, tipo = "info") {
        const span = document.createElement("span");
        span.className = tipo;
        span.textContent =
          new Date().toLocaleTimeString("pt-BR") + "  " + msg + "\n";
        elLog.appendChild(span);
        elLog.scrollTop = elLog.scrollHeight;
      }

      function setProgresso(atual, total) {
        const pct = total > 0 ? Math.round((atual / total) * 100) : 0;
        elFill.style.width = pct + "%";
        elLabel.textContent = `${atual} / ${total}  (${pct}%)`;
        elStatus.textContent = `Verificando exercício ${atual} de ${total}…`;
        elTotal.textContent = total;
        elCorrigido.textContent = cCorrigido;
        elSkip.textContent = cSkip;
        elErr.textContent = cErr;
      }

      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      /* ══════════ DIAGNÓSTICO ══════════ */
      btnDiag.addEventListener("click", async () => {
        btnDiag.disabled = true;
        elDiag.style.display = "block";
        elDiagCont.innerHTML = "<span style='color:#94a3b8'>Buscando…</span>";

        try {
          const snap = await db.ref("exercicios").limitToFirst(8).once("value");
          const amostra = [];
          snap.forEach((c) => amostra.push({ key: c.key, ...c.val() }));

          if (amostra.length === 0) {
            elDiagCont.innerHTML =
              "<span style='color:#f87171'>Nenhum exercício encontrado em /exercicios</span>";
            return;
          }

          // Monta tabela de diagnóstico
          let html = "";
          amostra.forEach((ex, i) => {
            const campos = [
              {
                label: "musculo_principal",
                val: ex.musculo_principal,
                tab: T_MUSCULO,
              },
              {
                label: "musculo_secundario",
                val: ex.musculo_secundario,
                tab: null,
              },
              { label: "equipamento", val: ex.equipamento, tab: T_EQUIPAMENTO },
              { label: "nivel", val: ex.nivel, tab: T_NIVEL },
              { label: "mecanica", val: ex.mecanica, tab: T_MECANICA },
              { label: "forca", val: ex.forca, tab: T_FORCA },
            ];

            const precisaCorrigir = campos.some(
              (c) => c.tab && c.val && c.val.trim().toLowerCase() in c.tab,
            );
            const badgeHtml = precisaCorrigir
              ? `<span class="badge badge-warn">⚠ inglês</span>`
              : `<span class="badge badge-ok">✓ ok</span>`;

            html += `<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #1e293b">`;
            html += `<div style="color:#e2e8f0;font-weight:600;margin-bottom:6px">${i + 1}. ${ex.nome_original || ex.nome || ex.key} ${badgeHtml}</div>`;

            campos.forEach((c) => {
              if (!c.val) return;
              const emIngles = c.tab
                ? c.val.trim().toLowerCase() in c.tab
                : false;
              const cor = emIngles ? "#fb923c" : "#4ade80";
              html += `<div class="diag-row">
                <span class="diag-label">${c.label}</span>
                <span class="diag-val" style="color:${cor}">${c.val}</span>
              </div>`;
            });
            html += `</div>`;
          });

          elDiagCont.innerHTML = html;
          btnCorrigir.disabled = false;
        } catch (err) {
          elDiagCont.innerHTML = `<span style="color:#f87171">Erro: ${err.message}</span>`;
          console.error(err);
        } finally {
          btnDiag.disabled = false;
        }
      });

      /* ══════════ CORREÇÃO ══════════ */
      const LOTE = 25;

      btnCorrigir.addEventListener("click", async () => {
        const ok = confirm(
          "Isso irá SOBRESCREVER os campos em inglês de TODOS os exercícios no Firebase.\n\n" +
            "Campos que já estão em português NÃO serão alterados.\n\n" +
            "Deseja continuar?",
        );
        if (!ok) return;

        btnCorrigir.disabled = true;
        btnDiag.disabled = true;
        elProg.style.display = "block";
        elResultado.style.display = "none";
        elLog.innerHTML = "";
        cTotal = cCorrigido = cSkip = cErr = 0;

        try {
          log("Buscando todos os exercícios…", "info");
          const snap = await db.ref("exercicios").once("value");

          if (!snap.exists()) {
            log("Nenhum exercício encontrado em /exercicios.", "warn");
            return;
          }

          const entries = [];
          snap.forEach((child) =>
            entries.push({ key: child.key, dados: child.val() }),
          );
          cTotal = entries.length;

          log(`Total de exercícios encontrados: ${cTotal}`, "info");
          setProgresso(0, cTotal);

          // Processa em lotes para não sobrecarregar o Firebase
          for (let i = 0; i < entries.length; i += LOTE) {
            const lote = entries.slice(i, i + LOTE);
            const updates = {};

            for (const { key, dados } of lote) {
              const { atualizado, mudou } = corrigirExercicio(key, dados);
              if (mudou) {
                updates[`exercicios/${key}`] = atualizado;
                cCorrigido++;
                log(
                  `✔ ${dados.nome_original || dados.nome || key} — corrigido`,
                  "ok",
                );
              } else {
                cSkip++;
                log(
                  `→ ${dados.nome_original || dados.nome || key} — já ok`,
                  "skip",
                );
              }
            }

            if (Object.keys(updates).length > 0) {
              await db.ref().update(updates);
            }

            setProgresso(Math.min(i + LOTE, cTotal), cTotal);
            await sleep(150); // respeita rate limits do Firebase
          }

          // Resultado final
          elFill.style.width = "100%";
          elLabel.textContent = `${cTotal} / ${cTotal}  (100%)`;
          elStatus.textContent = "Concluído!";
          elCorrigido.textContent = cCorrigido;
          elSkip.textContent = cSkip;
          elErr.textContent = cErr;

          elResultado.className = "sucesso";
          elResultado.style.display = "block";
          elResultado.innerHTML =
            `✅ Correção concluída!<br>` +
            `${cCorrigido} exercícios corrigidos · ${cSkip} já estavam corretos · ${cErr} erros`;

          log("═══ FIM DA CORREÇÃO ═══", "info");
        } catch (err) {
          cErr++;
          log("ERRO FATAL: " + err.message, "err");
          console.error(err);
          elResultado.className = "erro";
          elResultado.style.display = "block";
          elResultado.textContent = "❌ Erro: " + err.message;
        } finally {
          btnCorrigir.disabled = false;
          btnDiag.disabled = false;
        }
      });
    </script>
  </body>
</html>
